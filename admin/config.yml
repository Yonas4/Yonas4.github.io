backend:
  name: github
  repo: Yonas4/Yonas4.github.io
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Global fallback only. The projects collection overrides this so uploads land in
# per-project folders (see media_folder/public_folder on the collection below).
media_folder: "images/uploads"
public_folder: "images/uploads"

publish_mode: simple

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "data/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}} — {{category}}"
    # Uploads go to images/<project-slug>/ at the repo root, matching the folder
    # layout every existing asset already uses.
    #   media_folder  — leading "/" makes it repo-root relative (without it, Decap
    #                   treats it as relative to this collection's folder,
    #                   i.e. data/projects/).
    #   public_folder — the string written into the .md. Deliberately has NO
    #                   leading slash, because the renderers prefix it
    #                   (project.html uses "../", render-projects.js uses
    #                   data-icon-base) and every existing path is relative.
    media_folder: "/images/{{slug}}"
    public_folder: "images/{{slug}}"
    fields:
      # ===== Card / Hero basics =====
      - label: "Project Name"
        name: "name"
        widget: "string"
        hint: >-
          Fill this in FIRST on a new project. The filename and the images/<slug>/
          upload folder are both derived from it, and it is not renamed later if
          you change this.
      - { label: "Category / Tagline", name: "category", widget: "string" }
      - label: "Badge"
        name: "badge"
        widget: "select"
        options: ["Featured Project", "Personal Project", "Graduation", "Company Project"]
      - { label: "Short Card Description (shown on homepage grid)", name: "short_description", widget: "text" }
      - label: "App Icon"
        name: "icon"
        widget: "image"
        required: false
      - { label: "Display Order (lower = first)", name: "order", widget: "number", default: 0 }
      - label: "Card Accent Color (hex, optional — leave empty for auto)"
        name: "accent_color"
        widget: "color"
        required: false
        allowInput: true

      # ===== Case Study: Overview =====
      - { label: "Overview Paragraph", name: "overview", widget: "markdown", required: false }
      - label: "Overview Stats (the 3 highlight numbers)"
        name: "stats"
        widget: "list"
        required: false
        summary: "{{fields.number}} — {{fields.label}}"
        fields:
          - { label: "Number / Short Value (e.g. '3', 'Live', 'AR / EN')", name: "number", widget: "string" }
          - { label: "Label", name: "label", widget: "string" }

      # ===== Case Study: Core Capabilities =====
      - label: "Core Capabilities"
        name: "capabilities"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Emoji Icon (e.g. 💳)", name: "icon", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }

      # ===== Case Study: Architecture =====
      - { label: "Architecture Paragraph", name: "architecture_text", widget: "markdown", required: false }
      - label: "Architecture Flow Steps (in order)"
        name: "architecture_flow"
        widget: "list"
        required: false
        field: { label: "Step", name: "step", widget: "string" }

      # ===== Case Study: Walkthrough =====
      - label: "Screenshots Banner (optional, full-width image)"
        name: "banner"
        widget: "image"
        required: false
      - label: "Screenshots / Mockups"
        name: "mockups"
        widget: "list"
        required: false
        summary: "{{fields.caption}}"
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string" }
      - label: "Demo Video (MP4, keep under 20MB)"
        name: "video"
        widget: "file"
        required: false
        hint: >-
          Leave EMPTY unless you have actually uploaded a video here. A path to a
          file that does not exist renders a dead black player as the entire
          walkthrough section.
        # Overrides the collection's /images/{{slug}} so videos land in videos/<slug>/.
        media_folder: "/videos/{{slug}}"
        public_folder: "videos/{{slug}}"
        media_library:
          config:
            max_file_size: 20971520

      # ===== Case Study: Problems Solved =====
      - label: "Problems Solved"
        name: "challenges"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        fields:
          - { label: "Label (e.g. 'Strategy Pattern')", name: "label", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "text" }

      # ===== Tech + Links =====
      - label: "Tech Tags"
        name: "tech_tags"
        widget: "list"
        required: false
        field: { label: "Tag", name: "tag", widget: "string" }
      - label: "Links"
        name: "links"
        widget: "object"
        required: false
        fields:
          - { label: "GitHub", name: "github", widget: "string", required: false }
          - { label: "App Store", name: "app_store", widget: "string", required: false }
          - { label: "Google Play", name: "google_play", widget: "string", required: false }
